name: Build APK

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 说明：不再使用 android-actions/setup-android。
      # 该 Action 会在新版 runner 上执行 `sdkmanager tools`，而 Google 已移除 "tools" 包，
      # 导致 "Failed to find package 'tools'" + exit code 1，构建还没开始就失败。
      # 这里只用 runner 预装的 Android SDK，并补齐本项目需要的组件。
      - name: Configure Android SDK
        run: |
          set -euo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk" /opt/android-sdk; do
              if [ -d "$candidate" ]; then SDK="$candidate"; break; fi
            done
          fi

          if [ -z "${SDK:-}" ] || [ ! -d "$SDK" ]; then
            echo "未找到预装 Android SDK，下载 commandline-tools 自建"
            SDK="$HOME/android-sdk"
            mkdir -p "$SDK/cmdline-tools"
            curl -fsSL --retry 3 -o /tmp/cmdline-tools.zip \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            rm -rf /tmp/clt && mkdir -p /tmp/clt
            unzip -q /tmp/cmdline-tools.zip -d /tmp/clt
            mv /tmp/clt/cmdline-tools "$SDK/cmdline-tools/latest"
          fi

          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          echo "使用 SDK: $SDK"
          ls "$SDK"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="$ANDROID_SDK_ROOT"

          SDKMGR=""
          for candidate in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/20.0/bin/sdkmanager" \
            "$SDK/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMGR="$candidate"; break; fi
          done
          if [ -z "$SDKMGR" ]; then
            SDKMGR="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "$SDKMGR" ]; then
            echo "::error::未找到 sdkmanager"
            exit 1
          fi
          echo "使用 sdkmanager: $SDKMGR"

          # 接受许可；已接受时管道关闭会产生非零码，忽略即可
          yes | "$SDKMGR" --sdk_root="$SDK" --licenses > /dev/null || true

          # 只装需要的组件，绝不安装已废弃的 "tools"
          "$SDKMGR" --sdk_root="$SDK" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "--- 已安装 ---"
          "$SDKMGR" --sdk_root="$SDK" --list_installed || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Gradle 8.9
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 3 -fsSL \
            -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME"
          chmod +x "$HOME/gradle-8.9/bin/gradle"
          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"
          "$HOME/gradle-8.9/bin/gradle" --version

      - name: Show environment
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          cat local.properties
          java -version
          gradle --version

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: List APK
        run: ls -lh app/build/outputs/apk/debug/

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk "out/wechat-article-images-1.0.1-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wechat-article-images-debug
          path: out/*.apk
          if-no-files-found: error

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
